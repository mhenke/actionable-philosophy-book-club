name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check for unregistered meeting directories
        run: |
          set -euo pipefail
          ERRORS=0
          for dir in meetings/meeting-*/; do
            id=$(basename "$dir")
            [[ "$id" == "meeting-99-new" ]] && continue
            if ! grep -qE "\"id\": \"${id}\"|id: '${id}'" index.html dist/app.js docs/manifest.json 2>/dev/null; then
              echo "UNREGISTERED: $dir exists but '${id}' has no entry in the MEETINGS manifest"
              echo "Add a MEETINGS entry in docs/manifest.json or remove the directory."
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "Fix: Add entries for the above meeting IDs to docs/manifest.json."
            echo "See CONTRIBUTING.md for the manifest schema."
            exit 1
          fi
          echo "Manifest drift check passed."

      - name: Check image file sizes
        run: |
          set -euo pipefail
          MAX_KB=512
          ERRORS=0
          while IFS= read -r -d '' file; do
            [[ "$file" == meetings/meeting-99-new/* ]] && continue
            SIZE_KB=$(du -k "$file" | cut -f1)
            if [ "$SIZE_KB" -gt "$MAX_KB" ]; then
              echo "OVERSIZED: $file (${SIZE_KB} KB, limit ${MAX_KB} KB)"
              echo "  Use asset-compressor/scripts/ to compress before committing."
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find meetings \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" \) -type f -print0 2>/dev/null)
          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "Image size check passed."

      - name: ShellCheck bash scripts
        run: |
          shellcheck tests/check-links.sh
          shellcheck asset-compressor/scripts/rename_asset.sh
          shellcheck asset-compressor/scripts/compress_video.sh

      - name: Verify .nojekyll exists
        run: test -f .nojekyll

      - name: Verify vendor files exist
        run: |
          test -f dist/vendor/marked.min.js || (echo "Missing dist/vendor/marked.min.js" && exit 1)
          test -f dist/vendor/purify.min.js || (echo "Missing dist/vendor/purify.min.js" && exit 1)
          echo "Vendor files present"

      - name: Verify internal hash-route paths resolve to real files
        run: |
          # Match href="#p=..." — skip JS template literals like ${meeting.url}
          ERRORS=0
          while IFS= read -r path; do
            [[ "$path" =~ ^\$\{ ]] && continue  # skip JS template literals
            if [ ! -f "$path" ]; then
              echo "BROKEN: #p=$path"
              ERRORS=$((ERRORS+1))
            fi
          done < <(grep -oP '(?<=href="#p=)[^"]+' index.html; grep -oP '(?<=href="#p=)[^"]+' dist/app.js 2>/dev/null)
          [ "$ERRORS" -eq 0 ] && echo "Hash-route link check passed" || exit 1

      - name: Install Node dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Run link checker
        run: npm run test:links

      # Inline asset link check removed — npm run test:links covers it (and checks more extensions)

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Prepare Pages artifact
        run: |
          mkdir -p deploy
          cp index.html deploy/
          cp -r dist/ meetings/ docs/ templates/ .nojekyll deploy/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: 'deploy'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5

      - name: Smoke test deployed site
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://mhenke.github.io/actionable-philosophy-book-club/)
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: HTTP $STATUS"
            exit 1
          fi
          curl -sf https://mhenke.github.io/actionable-philosophy-book-club/ | \
            grep -q "A Philosophy of Software Design" || \
            (echo "Smoke test failed: expected content not found" && exit 1)
          echo "Smoke test passed"
