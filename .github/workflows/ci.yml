name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify .nojekyll exists
        run: test -f .nojekyll

      - name: Verify CDN SRI hashes match served content
        run: |
          set -euo pipefail
          ERRORS=0
          while IFS= read -r line; do
            url=$(echo "$line" | grep -oP '(?<=src=")[^"]+' | head -1)
            expected_full=$(echo "$line" | grep -oP '(?<=integrity=")[^"]+' | head -1)
            [ -z "$url" ] || [ -z "$expected_full" ] && continue
            algo=$(echo "$expected_full" | cut -d- -f1)
            expected_hash=$(echo "$expected_full" | cut -d- -f2-)
            bits=$(echo "$algo" | grep -oP '\d+')
            actual_hash=$(curl -sSLf "$url" | openssl dgst "-sha${bits}" -binary | openssl base64 -A)
            if [ "$actual_hash" != "$expected_hash" ]; then
              echo "SRI MISMATCH: $url"
              echo "  Expected: ${algo}-${expected_hash}"
              echo "  Actual:   ${algo}-${actual_hash}"
              ERRORS=$((ERRORS + 1))
            else
              echo "OK: $url"
            fi
          done < <(grep -P 'src="https://.+integrity=' index.html || grep -A1 'src="https://' index.html | grep 'integrity=' | paste - -)
          [ "$ERRORS" -eq 0 ] && echo "SRI verification passed." || exit 1

      - name: Verify internal hash-route paths resolve to real files
        run: |
          # Match href="#p=..." — skip JS template literals like ${meeting.url}
          ERRORS=0
          while IFS= read -r path; do
            [[ "$path" == \$* ]] && continue  # skip JS template literals
            if [ ! -f "$path" ]; then
              echo "BROKEN: #p=$path"
              ERRORS=$((ERRORS+1))
            fi
          done < <(grep -oP '(?<=href="#p=)[^"]+' index.html)
          [ "$ERRORS" -eq 0 ] && echo "Hash-route link check passed" || exit 1

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Verify internal asset href paths resolve to real files
        run: |
          ERRORS=0
          while IFS= read -r path; do
            [[ "$path" == \$* ]] && continue  # skip JS template literals
            [[ "$path" == http* ]] && continue
            if [ ! -f "$path" ]; then
              echo "BROKEN asset href: $path"
              ERRORS=$((ERRORS+1))
            fi
          done < <(grep -oP '(?<=href=")[^"]+\.(mp4|pptx|png)(?=")' index.html)
          [ "$ERRORS" -eq 0 ] && echo "Asset link check passed" || exit 1
