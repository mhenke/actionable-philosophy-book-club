name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check for unregistered meeting directories
        run: |
          set -euo pipefail
          ERRORS=0
          for dir in meetings/meeting-*/; do
            id=$(basename "$dir")
            [[ "$id" == "meeting-99-new" ]] && continue
            if ! grep -q "id: '${id}'" index.html; then
              echo "UNREGISTERED: $dir exists but '${id}' has no entry in the MEETINGS manifest in index.html"
              echo "Add a MEETINGS entry or remove the directory."
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "Fix: Add entries for the above meeting IDs to the MEETINGS array in index.html."
            echo "See CONTRIBUTING.md for the manifest schema."
            exit 1
          fi
          echo "Manifest drift check passed."

      - name: Check image file sizes
        run: |
          set -euo pipefail
          MAX_KB=512
          ERRORS=0
          while IFS= read -r -d '' file; do
            [[ "$file" == meetings/meeting-99-new/* ]] && continue
            SIZE_KB=$(du -k "$file" | cut -f1)
            if [ "$SIZE_KB" -gt "$MAX_KB" ]; then
              echo "OVERSIZED: $file (${SIZE_KB} KB, limit ${MAX_KB} KB)"
              echo "  Use asset-compressor/scripts/ to compress before committing."
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find meetings \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" \) -type f -print0 2>/dev/null)
          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "Image size check passed."

      - name: Verify .nojekyll exists
        run: test -f .nojekyll

      - name: Check CDN scripts have SRI integrity attributes
        run: |
          # Count <script> tags pointing at CDN URLs
          CDN_COUNT=$(grep -c 'src="https://' index.html || true)
          # Count integrity= attributes that appear within 3 lines of a CDN src
          INTEGRITY_COUNT=$(grep -A3 'src="https://' index.html | grep -c 'integrity=' || true)
          if [ "$CDN_COUNT" -ne "$INTEGRITY_COUNT" ]; then
            echo "ERROR: $CDN_COUNT CDN script(s) found but only $INTEGRITY_COUNT have integrity= attribute"
            exit 1
          fi
          echo "SRI check passed ($CDN_COUNT CDN script(s), all have integrity=)"

      - name: Verify internal hash-route paths resolve to real files
        run: |
          # Match href="#p=..." — skip JS template literals like ${meeting.url}
          ERRORS=0
          while IFS= read -r path; do
            [[ "$path" == \$* ]] && continue  # skip JS template literals
            if [ ! -f "$path" ]; then
              echo "BROKEN: #p=$path"
              ERRORS=$((ERRORS+1))
            fi
          done < <(grep -oP '(?<=href="#p=)[^"]+' index.html)
          [ "$ERRORS" -eq 0 ] && echo "Hash-route link check passed" || exit 1

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Verify internal asset href paths resolve to real files
        run: |
          ERRORS=0
          while IFS= read -r path; do
            [[ "$path" == \$* ]] && continue  # skip JS template literals
            [[ "$path" == http* ]] && continue
            if [ ! -f "$path" ]; then
              echo "BROKEN asset href: $path"
              ERRORS=$((ERRORS+1))
            fi
          done < <(grep -oP '(?<=href=")[^"]+\.(mp4|pptx|png)(?=")' index.html)
          [ "$ERRORS" -eq 0 ] && echo "Asset link check passed" || exit 1
