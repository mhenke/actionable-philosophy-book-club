title: Actionable Philosophy
description: An engineering book club exploring software design depth.
theme: null # We use our own custom layout
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
exclude:
  - asset-compressor/
  - PRODUCT.md
  - DESIGN.md
  - CONTRIBUTING.md
  - GEMINI.md
  - node_modules/
  - package.json
  - package-lock.json
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
