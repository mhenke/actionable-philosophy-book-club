<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "Actionable Philosophy" }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">
    <style>
        :root {
            --surface: oklch(23% 0.05 264);
            --surface-elevated: oklch(28% 0.08 264);
            --text-primary: oklch(93% 0.01 264);
            --text-muted: oklch(67% 0.04 264);
            --accent: oklch(73.5% 0.12 85);
            --accent-muted: oklch(45% 0.08 264);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--surface);
            color: var(--text-primary);
            line-height: 1.8;
        }
        h1, h2, h3, h4, .serif { font-family: 'Newsreader', serif; }
        
        /* Markdown Styling (impeccable) */
        .prose h1 { font-size: 3.5rem; font-weight: 900; margin-bottom: 2rem; font-style: italic; line-height: 1; letter-spacing: -0.02em; }
        .prose h2 { font-size: 2.25rem; font-weight: 800; margin-top: 4rem; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem; color: var(--accent); }
        .prose h3 { font-size: 1.5rem; font-weight: 700; margin-top: 2.5rem; margin-bottom: 1rem; font-style: italic; opacity: 0.9; }
        .prose p { margin-bottom: 1.5rem; opacity: 0.8; font-size: 1.125rem; }
        .prose ul { margin-bottom: 2rem; list-style-type: none; padding-left: 0; }
        .prose li { position: relative; padding-left: 1.5rem; margin-bottom: 0.75rem; opacity: 0.8; }
        .prose li::before { content: "—"; position: absolute; left: 0; color: var(--accent); opacity: 0.4; }
        .prose strong { color: white; font-weight: 700; }
        .prose blockquote { border-left: 4px solid var(--accent); padding-left: 2rem; font-style: italic; margin: 3rem 0; opacity: 0.9; font-size: 1.25rem; color: var(--text-primary); }
        .prose a { color: var(--accent); text-decoration: underline; text-decoration-color: rgba(200, 169, 110, 0.2); text-underline-offset: 4px; transition: all 0.2s; }
        .prose a:hover { text-decoration-color: var(--accent); opacity: 1; }
        .prose code { background: rgba(255,255,255,0.05); padding: 0.2rem 0.4rem; rounded: 4px; font-size: 0.9em; font-family: monospace; }
        
        .nav-link { font-size: 10px; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.3; transition: opacity 0.2s; }
        .nav-link:hover { opacity: 1; color: var(--accent); }
    </style>
</head>
<body class="p-6 md:p-16 max-w-4xl mx-auto">

    <nav class="mb-24 flex items-center justify-between">
        <a href="{{ '/' | relative_url }}" class="nav-link">&larr; Back to Dashboard</a>
        <span class="nav-link opacity-10">APoSD Library</span>
    </nav>

    <article class="prose prose-invert max-w-none">
        {{ content }}
    </article>

    <footer class="mt-48 py-20 border-t border-white/5 text-center">
        <p class="text-[10px] font-black tracking-[0.4em] opacity-10 mb-8 uppercase">DOCUMENT DISTILLED FOR ACTIONABLE PHILOSOPHY</p>
        <p class="text-[10px] font-black text-[var(--accent)] tracking-[0.3em] uppercase opacity-40">Spare Time Excellence &bull; 2026</p>
    </footer>

</body>
</html>
